<header data-bg="purple-gradient" class="section_header"><div data-pv="bonv-hero-bg"></div><div class="padding-global padding-section-home_header"><div class="container-large"><div class="header_component"><div class="w-layout-grid header_content"><div id="w-node-_2fd2bd32-c3d8-e437-5e6d-d952b6372e73-9ba262dc" class="header_content-left"><div class="margin-bottom margin-medium gap-24"><h1 class="text-size-display text-color-alternate">Meet BonV:<br/><span class="text-color-yellow">Ask. Connect. Decide.</span></h1><div class="text-size-large">BonV is PhaseV’s agentic layer for clinical development. Ask a question in plain language, and BonV connects the right PhaseV capabilities and your own tools into one explainable workflow, with your experts approving every step.</div></div><div class="button-group gap-24"><a data-wf--button--variant="yellow" href="/contact" class="button w-button">Request a demo</a><a data-wf--button--variant="transparent" href="#bonv-video" class="button w-variant-a4343b71-de97-ab07-2e4d-8afb553ce387 w-button">Watch the video</a></div></div><div data-pv="bonv-hero-slot"></div></div></div></div></div></header>
<div class="pv-proto-after"></div>
<div class="pv-proto-state" aria-hidden="true"></div>
<style>
/* Proto seulement : état courant, pour le réglage */
.pv-proto-state{ position:fixed; left:16px; bottom:16px; z-index:50; font:12px/1 "Roboto Mono",ui-monospace,monospace; letter-spacing:.1em; text-transform:uppercase; color:#f4f4f4; background:rgba(6,4,26,.6); padding:.5rem .75rem; border-radius:999px; }
</style>
<script type="module">
/* Hero BonV : le V et son anneau de points jaunes, comme un chatbot.
   Boucle : BonV parle (les points pulsent comme une voix), puis réfléchit (une vague fait le tour de l'anneau), et ainsi de suite.
   Logique de l'anneau reprise du kit bonv-style (bonv-mark.js) ; rendu par le socle des heros produit (src/hero-stage.js).
   ?t=2 fige l'instant, pour le réglage. */
import { mountHeroStage, cl, smooth, TAU } from '/src/hero-stage.js';

const YEL = '#E2C70A', WHITE = '#F4F4F4';
const VPTS = [[0.2749,-0.4797],[-0.0004,0.1548],[-0.2181,-0.3639],[-0.2710,-0.4797],[-0.5574,-0.4797],[-0.0170,0.6489],[0.0186,0.6489],[0.5574,-0.4797]];
/* Chronologie (s) : parle, puis réfléchit ; fondu de 0,7 s entre les deux */
const SPEAK = 3.6, THINK = 3.6, LOOP = SPEAK + THINK, X = .7, STILL = 1.8;
const label = document.querySelector('.pv-proto-state');

function states(k) {
  // poids de « réfléchit » : monte autour de SPEAK, redescend sur la fin de boucle pour repartir de « parle » sans saut
  const th = cl(smooth(SPEAK - X / 2, SPEAK + X / 2, k) - smooth(LOOP - X, LOOP, k));
  return { sp: 1 - th, th };
}

function draw(stage, T) {
  const { ctx: c, W, H, flow, mouse } = stage;
  c.clearRect(0, 0, W, H);
  const k = T % LOOP, { sp, th } = states(k);
  if (label) label.textContent = sp > th ? 'BonV parle' : 'BonV réfléchit';

  // place : à droite du texte en mode fond, centré dans le bloc 4:3 en mode bloc
  const r = flow ? Math.min(W, H) * .17 : Math.min(W * .085, H * .135);
  const x = (flow ? W * .5 : W * .71) + mouse.x * 18, y = H * .5 + mouse.y * 18;
  const alpha = stage.fade(x);

  // anneau de points (logique de bonv-mark.js)
  const rr = r * 1.47, rot = T * .22;
  const n = Math.max(24, Math.round(TAU * rr / Math.max(9, r * .16))), dr = Math.max(1.1, r * .028);
  const head = T * 3.6, voice = .55 + .45 * Math.sin(T * 13) * Math.sin(T * 7.3 + 1);
  c.fillStyle = YEL;
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * TAU;
    const d = ((a - head) % TAU + Math.PI * 3) % TAU - Math.PI;
    const bump = Math.exp(-((d / .42) ** 2)) * th;
    const amp = .5 + .5 * Math.sin(a * 3 + T * 9) * Math.sin(a * 5 - T * 7 + 1.3), vo = sp * voice * amp;
    const R = rr + r * (.06 * bump + .18 * vo), s = dr * (1 + 1.2 * bump + 1.3 * vo), light = .72 + .28 * Math.cos(a + Math.PI * .75);
    c.globalAlpha = Math.min(1, (.8 + .2 * bump + .2 * vo) * light) * alpha;
    c.beginPath(); c.arc(x + Math.cos(a) * R, y + Math.sin(a) * R, s, 0, TAU); c.fill();
  }
  // disque jaune et V blanc
  c.globalAlpha = alpha;
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  c.fillStyle = WHITE; c.beginPath();
  VPTS.forEach(([px, py], i) => { const X_ = x + px * r, Y_ = y + py * r; i ? c.lineTo(X_, Y_) : c.moveTo(X_, Y_); });
  c.closePath(); c.fill();
  c.globalAlpha = 1;
}

const root = document.querySelector('[data-pv="bonv-hero-bg"]');
const still = new URLSearchParams(location.search).get('t');
mountHeroStage(root, { name: 'bonv', draw: still !== null ? (st) => draw(st, +still) : draw, still: STILL });
</script>
