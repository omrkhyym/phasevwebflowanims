<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhaseV ClinOps Proof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* fond : section .is-white ; vert : .text-color-green (#087f6a) */
  :root{ --bg:#ffffff; --ink:#141238; --mut:#7d7b9c; --line:#e3e1ef; --green:#087f6a; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:Roboto,system-ui,sans-serif; }
  .proto{ max-width:1320px; margin:0 auto; padding:72px 44px; }
  @media(max-width:700px){ .proto{ padding:56px 16px; } }
  .bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;
        font:500 11px/1 'Roboto Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--mut); }
  .bar button{ font:500 11px/1 'Roboto Mono',monospace; letter-spacing:.1em; text-transform:uppercase;
        padding:9px 14px; background:transparent; color:var(--ink); border:1px solid var(--line); cursor:pointer; }
  .grid{ display:grid; grid-template-columns:1fr 1.1fr; gap:64px; align-items:center; }
  @media(max-width:900px){ .grid{ grid-template-columns:1fr; gap:36px; } }
  .tagline{ display:inline-block; font:500 12px/1 'Roboto Mono',monospace; letter-spacing:.08em; text-transform:uppercase;
        color:var(--green); border:1px solid var(--green); padding:7px 10px; margin-bottom:24px; }
  .num{ font-size:clamp(48px,6vw,84px); font-weight:700; letter-spacing:-.03em; line-height:1; }
  .sub{ font-size:24px; font-weight:700; color:var(--green); margin:6px 0 20px; }
  p{ font-size:17px; line-height:1.6; color:#6b6a80; margin:0; }
  p strong{ color:var(--ink); }
  .anim{ position:relative; width:100%; aspect-ratio:1/1; }
  .anim canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; transition:opacity .5s ease; }
</style>
</head>
<body>

<section class="proto">
  <div class="bar"><span>Proto · ClinOps · Proof</span><button id="replay">Replay</button></div>
  <div class="grid">
    <div>
      <div class="tagline">Phase III breast cancer retrospective</div>
      <div class="num">53%</div>
      <div class="sub">faster recruiting</div>
      <p>Sites identified by PhaseV recruited at an average of <strong>0.43 patients per site per month</strong>, compared with <strong>0.28</strong> among non-recommended sites.</p>
    </div>
    <div class="anim" id="anim"><canvas></canvas></div>
  </div>
</section>

<script>
(() => {
const INK='#141238', GRN='#087f6a', MUT='#7d7b9c', GRID='#e3e1ef';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const ease=v=>v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2;
const mono=(w,s)=>`${w} ${s}px 'Roboto Mono',monospace`;
function rng(s){ return ()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* Chronologie (s) : sites à l'aveugle, sélection PhaseV, levée d'aveugle, moyennes */
const T={ grid:0, pick:1.4, reveal:3.2, means:5.8, gap:6.8, out:11.2, loop:12 };
const STILL=9;

/* 357 sites (= sites activés dans l'étude), en grille 21 × 17.
   Taux réels générés : seules les deux moyennes sont réelles (0.43 et 0.28),
   la part de sites recommandés est une hypothèse de proto. */
const COLS=21, ROWS=17, N=COLS*ROWS, REC_SHARE=.4, M_REC=.43, M_OTH=.28;
const SITES=(()=>{ const R=rng(9), g=()=>Math.sqrt(-2*Math.log(R()+1e-9))*Math.cos(6.2832*R()), S=[];
  for(let i=0;i<N;i++){ const rec=R()<REC_SHARE, sg=.55;
    S.push({ i, rec, v:Math.exp(sg*g()-sg*sg/2), jx:R()-.5, d:R() }); }
  // recalage : chaque groupe tombe exactement sur sa moyenne
  for(const [flag,m] of [[true,M_REC],[false,M_OTH]]){ const G=S.filter(s=>s.rec===flag), avg=G.reduce((a,s)=>a+s.v,0)/G.length;
    G.forEach(s=>s.v=Math.min(s.v*m/avg,.97)); }
  return S; })();

const box=document.getElementById('anim'), cv=box.querySelector('canvas'), x=cv.getContext('2d');
let W=0,H=0;

/* bg : pastille blanche derrière le texte, pour les étiquettes posées sur le nuage */
function txt(s,px,py,f,c,a=1,al='left',bg=false){ if(a<=0) return; x.font=f; const w=x.measureText(s).width, x0=al==='left'?px:al==='right'?px-w:px-w/2;
  if(bg){ x.globalAlpha=a*.92; x.fillStyle='#fff'; x.fillRect(x0-4,py-12,w+8,16); }
  x.globalAlpha=a; x.fillStyle=c; x.textAlign='left'; x.fillText(s,x0,py); x.globalAlpha=1; }

function draw(t){
  x.clearRect(0,0,W,H);
  const fs=W<420?9:10, L=Math.max(40,W*.09), Rr=W-8, T0=W<480?54:40, B=H-44;
  const Y=v=>B-v*(B-T0);
  const colW=(Rr-L)*.34, cA=L+(Rr-L)*.27, cB=L+(Rr-L)*.75;

  // grille de départ
  const gs=Math.min((W*.78)/COLS,(H*.55)/ROWS), gx0=W/2-gs*(COLS-1)/2, gy0=H*.48-gs*(ROWS-1)/2;

  // axe : apparaît avec la levée d'aveugle
  const ax=seg(t,T.reveal,T.reveal+.6);
  if(ax>0){
    x.font=mono(400,fs); x.textAlign='right';
    for(const v of [0,.2,.4,.6,.8]){ const y=Math.round(Y(v))+.5; x.globalAlpha=ax; x.fillStyle=MUT; x.fillText(v.toFixed(1),L-8,y+3);
      x.strokeStyle=GRID; x.beginPath(); x.moveTo(L,y); x.lineTo(Rr,y); x.stroke(); }
    x.globalAlpha=1; x.textAlign='left';
    txt('PATIENTS / SITE / MONTH',0,T0-14,mono(500,fs),MUT,ax);
    txt('RECOMMENDED',cA,B+22,mono(700,fs),GRN,ax,'center');
    txt('NOT RECOMMENDED',cB,B+22,mono(500,fs),MUT,ax,'center');
  }

  // sites
  const pk=t>=T.pick;
  for(const s of SITES){
    const gxp=gx0+(s.i%COLS)*gs, gyp=gy0+Math.floor(s.i/COLS)*gs;
    const k=ease(seg(t,T.reveal+s.d*1.1,T.reveal+1.2+s.d*1.1));
    const tx=(s.rec?cA:cB)+s.jx*colW, ty=Y(s.v);
    const px=gxp+(tx-gxp)*k, py=gyp+(ty-gyp)*k;
    // la sélection s'allume site par site
    const on=s.rec?seg(t,T.pick+s.d*1.2,T.pick+.25+s.d*1.2):0;
    // après la levée, les non-recommandés passent au second plan
    const dim=s.rec?1:1-.35*seg(t,T.means,T.means+.6);
    x.globalAlpha=(on>0?.35+.65*on:.35)*dim;
    x.fillStyle=on>0?GRN:INK;
    x.beginPath(); x.arc(px,py,on>0?2.4+.6*on:2.4,0,6.2832); x.fill();
  }
  x.globalAlpha=1;

  // moyennes
  const kmA=ease(seg(t,T.means,T.means+.6)), kmB=ease(seg(t,T.means+.3,T.means+.9));
  const yA=Y(M_REC), yB=Y(M_OTH), a0=cA-colW*.62, b0=cB-colW*.62;
  if(kmB>0){ x.strokeStyle=INK; x.lineWidth=1.5; x.globalAlpha=.7; x.beginPath(); x.moveTo(b0,yB); x.lineTo(b0+colW*1.24*kmB,yB); x.stroke(); x.globalAlpha=1; }
  if(kmA>0){ x.strokeStyle=GRN; x.lineWidth=2; x.beginPath(); x.moveTo(a0,yA); x.lineTo(a0+colW*1.24*kmA,yA); x.stroke();
    // prolongement pointillé pour comparer d'une colonne à l'autre
    const kd=ease(seg(t,T.gap,T.gap+.6));
    if(kd>0){ x.save(); x.setLineDash([3,4]); x.globalAlpha=.8; x.lineWidth=1.25; x.beginPath(); x.moveTo(a0+colW*1.24,yA); x.lineTo(a0+colW*1.24+(b0+colW*1.24-a0-colW*1.24)*kd,yA); x.stroke(); x.restore(); } }
  txt('0.43',a0,yA-8,mono(700,fs+1),GRN,seg(t,T.means+.4,T.means+.8),'left',true);
  txt('0.28',b0+colW*1.24,yB-8,mono(700,fs+1),INK,seg(t,T.means+.7,T.means+1.1),'right',true);

  // écart
  const kg=ease(seg(t,T.gap+.4,T.gap+1)), gx=b0-10;
  if(kg>0){ x.strokeStyle=GRN; x.lineWidth=1.5; x.globalAlpha=kg; x.beginPath();
    x.moveTo(gx+5,yA); x.lineTo(gx,yA); x.lineTo(gx,yA+(yB-yA)*kg); x.lineTo(gx+5,yA+(yB-yA)*kg); x.stroke(); x.globalAlpha=1; }
  txt('+53%',gx-8,(yA+yB)/2+5,mono(700,fs+4),GRN,seg(t,T.gap+.8,T.gap+1.2),'right',true);

  // état
  const st=[['357 SITES · OUTCOMES BLINDED',0,T.pick,MUT],['PHASEV RECOMMENDS',T.pick,T.reveal,GRN],['WHAT ACTUALLY HAPPENED',T.reveal,99,INK]];
  for(const [s0,a,b,c] of st) txt(s0,W,14,mono(700,fs),c,Math.min(seg(t,a,a+.3),1-seg(t,b-.3,b)),'right');
}

/* ---------- boucle : tourne seulement à l'écran ---------- */
let t=0, raf=0, last=0;
function fit(){ const dpr=Math.min(devicePixelRatio||1,2), r=box.getBoundingClientRect();
  W=r.width; H=r.height; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); x.setTransform(dpr,0,0,dpr,0,0); draw(reduce?STILL:t); }
function frame(now){ raf=requestAnimationFrame(frame); t+=Math.min((now-last)/1000,.05); last=now;
  if(t>T.loop) t=0; cv.style.opacity=t>T.out?0:1; draw(t); }
function start(){ if(raf||reduce) return; t=0; last=performance.now(); raf=requestAnimationFrame(frame); }
function stop(){ cancelAnimationFrame(raf); raf=0; }
new ResizeObserver(fit).observe(box);
new IntersectionObserver(([e])=>e.isIntersecting?start():stop(),{threshold:.35}).observe(box);
document.getElementById('replay').onclick=()=>{ stop(); cv.style.opacity=1; start(); };
if(document.fonts) document.fonts.ready.then(()=>draw(reduce?STILL:t));
})();
</script>
</body>
</html>
