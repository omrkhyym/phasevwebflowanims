<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhaseV ClinOps Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* --bg : approximation de .is-lightpurple */
  :root{ --bg:#ECEAF6; --ink:#141238; --mut:#7d7b9c; --line:#d3d0e8; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:Roboto,system-ui,sans-serif; }
  .proto{ max-width:1320px; margin:0 auto; padding:88px 44px; }
  @media(max-width:700px){ .proto{ padding:56px 16px; } }
  .bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:44px;
        font:500 11px/1 'Roboto Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--mut); }
  .bar button{ font:500 11px/1 'Roboto Mono',monospace; letter-spacing:.1em; text-transform:uppercase;
        padding:9px 14px; background:transparent; color:var(--ink); border:1px solid var(--line); cursor:pointer; }
  .head{ max-width:670px; }
  .label{ font:400 12px/1.4 'Roboto Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--mut); margin-bottom:20px; }
  h2{ font-size:clamp(30px,3.6vw,48px); line-height:1.08; font-weight:600; letter-spacing:-.02em; margin:0 0 24px; }
  p{ font-size:17px; line-height:1.6; color:#2b2a48; margin:0; }
  .anim{ position:relative; width:100%; aspect-ratio:16/5.4; margin-top:56px; }
  @media(max-width:700px){ .anim{ aspect-ratio:4/3.4; } }
  .anim canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; transition:opacity .5s ease; }
</style>
</head>
<body>

<section class="proto">
  <div class="bar"><span>Proto · ClinOps · Workflow</span><button id="replay">Replay</button></div>
  <div class="head">
    <div class="label">The ClinOps workflow</div>
    <h2>From protocol feasibility to an enrollment plan that can adapt.</h2>
    <p>Assess the patient opportunity, build an explainable footprint, simulate how it may perform, and update the forecast when actual study data arrive.</p>
  </div>
  <div class="anim" id="anim"><canvas></canvas></div>
</section>

<script>
(() => {
const INK=[20,18,56], MAU=[146,138,205], YEL='#E2C70A', MUT='#7d7b9c', GRID='#d3d0e8';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const ease=v=>v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2;
const mix=(a,b,k)=>a+(b-a)*k;
const mono=(w,s)=>`${w} ${s}px 'Roboto Mono',monospace`;
function rng(s){ return ()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* Chronologie (s). Une seule population de particules : patients, puis sites, puis plan d'enrôlement. */
const T={ waves:[1.0,1.7,2.4], pool:3.0, sites:4.2, pick:6.0, fan:8.0, act:12.0, refc:13.6, upd:15.0, out:17.0, loop:18 };
const STEPS=[['FEASIBILITY',0],['SITE STRATEGY',4.1],['ENROLLMENT',7.9],['REFORECASTING',11.9]];
const STILL=16;

/* Courbes d'enrôlement cumulé, en fractions : u = temps (0..1), valeur = part de la cible */
const NC=12, TODAY=.45, MILESTONE=.78;
const plan=(u,g)=>(1+.16*g)/(1+Math.exp(-(u-.42)/.1))-(1+.16*g)/(1+Math.exp(.42/.1));
const actual=u=>plan(u,0)*.8;   // le réel prend du retard sur le plan
const refc=(u,g)=>{ const a0=actual(TODAY), k=(u-TODAY)/(1-TODAY);
  return a0+((1+.12*g)-a0)*(1-Math.exp(-k*2.6))/(1-Math.exp(-2.6)); };   // nouvelle trajectoire depuis les données réelles

const NS=14, NPICK=9;
function build(N){
  const R=rng(17), g=()=>{ let v; do { v=Math.sqrt(-2*Math.log(R()+1e-9))*Math.cos(6.2832*R()); } while(Math.abs(v)>2.4); return v; };   // tirage rejeté plutôt que borné : pas de colonnes de points aux bords
  /* poids des sites, classés du plus fort au plus faible */
  const w=[...Array(NS)].map((_,i)=>Math.exp(-i*.15)*(.75+.5*R())).sort((a,b)=>b-a), wsum=w.reduce((a,b)=>a+b,0);
  const CG=[...Array(NC)].map((_,k)=>k===0?0:g());
  const P=[];
  for(let i=0;i<N;i++){
    const u=R();
    // 3 vagues d'exclusion (éligibilité, échec de screening, compétition) : ~55 % sortent
    const wave=u<.22?0:u<.40?1:u<.55?2:-1;
    let site=-1;
    if(wave<0){ let r=R()*wsum; site=0; while(r>w[site]&&site<NS-1){ r-=w[site]; site++; } }
    P.push({ wave, site, ax:g(), ay:g(), bx:g(), by:g(), sx:g(), sy:g(), d:R(),
             k:Math.floor(R()*NC), u:R(), j:R()-.5, s:1.2+R()*.9, ink:R()<.35 });
  }
  return {P,w,CG};
}

const box=document.getElementById('anim'), cv=box.querySelector('canvas'), x=cv.getContext('2d');
let W=0,H=0,D=build(2600);

function txt(s,px,py,f,c,a=1,al='left'){ if(a<=0) return; x.font=f; x.textAlign=al; x.globalAlpha=a; x.fillStyle=c; x.fillText(s,px,py); x.globalAlpha=1; x.textAlign='left'; }

function draw(t){
  x.clearRect(0,0,W,H);
  const fs=W<500?9:10, L=W<500?30:44, R=W-8, T0=26, B=H-46;
  const cx=W/2, cy=(T0+B)/2;
  const X=u=>L+u*(R-L), Y=v=>B-v*(B-T0)*.86;
  const {P,w,CG}=D, wmax=w[0];
  const siteX=i=>L+(i+.5)/NS*(R-L), siteY=cy+6;

  /* ---------- décor par étape ---------- */
  // sites : accolade sous la sélection
  const kb=ease(seg(t,T.pick+.4,T.pick+1))*(1-seg(t,T.fan-.4,T.fan));
  if(kb>0){ const x0=siteX(0)-14, x1=siteX(NPICK-1)+14, y=siteY+(B-T0)*.32;
    x.strokeStyle=YEL; x.lineWidth=3; x.globalAlpha=kb; x.beginPath(); x.moveTo(x0,y); x.lineTo(mix(x0,x1,kb),y); x.stroke(); x.globalAlpha=1;
    txt('SELECTED FOOTPRINT',x0,y+16,mono(700,fs),'#141238',kb); }

  // axes du plan
  const kx=seg(t,T.fan-.2,T.fan+.4)*(1-seg(t,T.out-.2,T.out));
  if(kx>0){
    x.globalAlpha=kx*.5; x.strokeStyle='#141238'; x.lineWidth=1;
    x.beginPath(); x.moveTo(L+.5,T0); x.lineTo(L+.5,B+.5); x.lineTo(R,B+.5); x.stroke(); x.globalAlpha=1;
    txt('ENROLLED',L,T0-10,mono(500,fs),MUT,kx);
    txt('TIME',R,B+16,mono(500,fs),MUT,kx,'right');
    const kt=seg(t,T.fan+1.4,T.fan+1.9)*(1-seg(t,T.out-.2,T.out));
    if(kt>0){ x.save(); x.setLineDash([4,4]); x.strokeStyle='#141238'; x.globalAlpha=.6*kt;
      x.beginPath(); x.moveTo(L,Y(1)); x.lineTo(R,Y(1)); x.stroke();
      x.beginPath(); x.moveTo(X(MILESTONE),T0); x.lineTo(X(MILESTONE),B); x.stroke(); x.restore();
      txt('TARGET',L+6,Y(1)-6,mono(500,fs),'#141238',kt);
      txt('MILESTONE',X(MILESTONE)+6,B-6,mono(500,fs),'#141238',kt); }
    const ktd=seg(t,T.act,T.act+.4)*(1-seg(t,T.out-.2,T.out));
    if(ktd>0){ x.strokeStyle='#141238'; x.lineWidth=1.25; x.globalAlpha=ktd; x.beginPath(); x.moveTo(X(TODAY),T0); x.lineTo(X(TODAY),B); x.stroke(); x.globalAlpha=1;
      txt('TODAY · ACTUAL DATA',X(TODAY)-6,T0+10,mono(700,fs),'#141238',ktd,'right'); }
  }

  /* ---------- particules ---------- */
  for(const p of P){
    // A : bassin de patients large, puis pool accessible resserré
    const ax=cx+p.ax*(R-L)*.13, ay=cy+p.ay*(B-T0)*.2;
    const bx=cx+p.bx*(R-L)*.05, by=cy+p.by*(B-T0)*.13;
    let px=ax, py=ay, a=.0, col=MAU;
    const kin=ease(seg(t,0,.8+p.d*.4));
    if(p.wave>=0){
      // exclus : s'éteignent à leur vague et glissent vers le bas
      const kw=ease(seg(t,T.waves[p.wave]+p.d*.3,T.waves[p.wave]+.5+p.d*.3));
      px=ax; py=ay+kw*18; a=kin*(.55-.45*kw)*(1-seg(t,T.pool,T.sites));
      col=p.ink?INK:MAU;
    } else {
      const kp=ease(seg(t,T.pool+p.d*.4,T.pool+.9+p.d*.4));
      px=mix(ax,bx,kp); py=mix(ay,by,kp); a=kin*.7; col=kp>.5||p.ink?INK:MAU;

      // B : répartition dans les sites, taille ∝ poids du site
      const ks=ease(seg(t,T.sites+p.d*.6,T.sites+1.2+p.d*.6));
      const r=(6+12*Math.sqrt(w[p.site]/wmax))*(W<500?.6:1);
      const sx=siteX(p.site)+p.sx*r*.55, sy=siteY+p.sy*r*.55;
      px=mix(px,sx,ks); py=mix(py,sy,ks);
      const picked=p.site<NPICK, kpk=seg(t,T.pick+p.site*.05,T.pick+.4+p.site*.05);
      if(ks>.5){ col=picked?INK:MAU; a=picked?.8:.75-.45*kpk; }

      // C : le footprint retenu alimente le fan de trajectoires
      const kf=ease(seg(t,T.fan+p.u*1.2,T.fan+.8+p.u*1.2));
      if(picked){
        const g=CG[p.k], fx=X(p.u), fy=Y(plan(p.u,g))+p.j*2;
        px=mix(px,fx,kf); py=mix(py,fy,kf);
        if(kf>.5){ col=p.k===0?INK:MAU; a=p.k===0?.9:.6; }

        // D : avant aujourd'hui, les particules se posent sur le réel ; après, sur la nouvelle trajectoire
        if(p.u<TODAY){
          const kd=ease(seg(t,T.act+p.u*2.6,T.act+.5+p.u*2.6));
          px=mix(px,X(p.u),kd); py=mix(py,Y(actual(p.u))+p.j*1.5,kd);
          if(kd>.5){ col=INK; a=.9; }
        } else {
          const kr=ease(seg(t,T.refc+(p.u-TODAY)*1.6,T.refc+.9+(p.u-TODAY)*1.6));
          const ry=Y(refc(p.u,CG[p.k]))+p.j*2;
          py=mix(py,ry,kr);
        }
      } else { a*=1-seg(t,T.fan,T.fan+.6); }
    }
    // fondu de boucle
    a*=1-seg(t,T.out,T.out+.5);
    if(a<=.01) continue;
    x.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${a})`;
    x.fillRect(px-p.s/2,py-p.s/2,p.s,p.s);
  }

  // plan d'origine en fantôme, puis prévision mise à jour : seul jaune de l'étape
  const kg=seg(t,T.refc,T.refc+.6)*(1-seg(t,T.out-.2,T.out));
  if(kg>0){ x.save(); x.setLineDash([2,4]); x.strokeStyle='#141238'; x.globalAlpha=.45*kg; x.lineWidth=1.25; x.beginPath();
    for(let i=0;i<=80;i++){ const u=TODAY+(1-TODAY)*i/80; i?x.lineTo(X(u),Y(plan(u,0))):x.moveTo(X(u),Y(plan(u,0))); } x.stroke(); x.restore();
    txt('PLAN',X(.62),Y(plan(.62,0))-10,mono(500,fs),MUT,kg); }
  const ku=ease(seg(t,T.upd,T.upd+.9))*(1-seg(t,T.out-.2,T.out));
  if(ku>0){ const path=()=>{ x.beginPath(); for(let i=0;i<=80;i++){ const u=TODAY+(1-TODAY)*ku*i/80; i?x.lineTo(X(u),Y(refc(u,0))):x.moveTo(X(u),Y(refc(u,0))); } };
    path(); x.strokeStyle='#141238'; x.lineWidth=4.5; x.stroke(); path(); x.strokeStyle=YEL; x.lineWidth=2.5; x.stroke();
    txt('UPDATED FORECAST',X(.9),Y(refc(.9,0))+20,mono(700,fs),'#141238',seg(t,T.upd+.7,T.upd+1.1),'right'); }

  // faisabilité : chaque vague d'exclusion est nommée, puis le pool accessible
  const WN=['ELIGIBILITY CRITERIA','SCREEN FAILURE','COMPETING TRIALS'];
  WN.forEach((n,i)=>{ const a0=T.waves[i]; txt('− '+n,L,T0+i*16,mono(500,fs),MUT,seg(t,a0,a0+.3)*(1-seg(t,T.sites-.3,T.sites))); });
  txt('ACCESSIBLE PATIENTS',cx,cy+(B-T0)*.13*2.6+14,mono(700,fs),'#141238',seg(t,T.pool+.8,T.pool+1.2)*(1-seg(t,T.sites,T.sites+.4)),'center');
  txt('SITES RANKED BY PROTOCOL FIT · RECRUITMENT · OPERATIONS',L,T0,mono(500,fs),MUT,seg(t,T.sites+.8,T.sites+1.2)*(1-seg(t,T.fan-.4,T.fan)));

  /* ---------- étapes, en bas ---------- */
  let cur=0; STEPS.forEach(([,t0],i)=>{ if(t>=t0) cur=i; });
  const sw=(R-L)/4, sy=H-8;
  x.strokeStyle=GRID; x.lineWidth=1; x.beginPath(); x.moveTo(L,sy-16.5); x.lineTo(R,sy-16.5); x.stroke();
  const prog=cl(t/T.out);
  x.strokeStyle='#141238'; x.lineWidth=1.5; x.beginPath(); x.moveTo(L,sy-16.5); x.lineTo(L+(R-L)*prog,sy-16.5); x.stroke();
  STEPS.forEach(([n],i)=>{ const on=i===cur;
    txt((W<500?'':'0'+(i+1)+' · ')+n,L+sw*i,sy,mono(on?700:500,W<500?8:fs),on?'#141238':MUT,on?1:.8); });
}

/* ---------- boucle : tourne seulement à l'écran ---------- */
let t=0, raf=0, last=0;
function fit(){ const dpr=Math.min(devicePixelRatio||1,2), r=box.getBoundingClientRect(), wide=r.width>=500;
  if(wide!==(W>=500)||!W) D=build(wide?2600:1500);
  W=r.width; H=r.height; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); x.setTransform(dpr,0,0,dpr,0,0); draw(reduce?STILL:t); }
function frame(now){ raf=requestAnimationFrame(frame); t+=Math.min((now-last)/1000,.05); last=now;
  if(t>T.loop) t=0; draw(t); }
function start(){ if(raf||reduce) return; t=0; last=performance.now(); raf=requestAnimationFrame(frame); }
function stop(){ cancelAnimationFrame(raf); raf=0; }
new ResizeObserver(fit).observe(box);
new IntersectionObserver(([e])=>e.isIntersecting?start():stop(),{threshold:.35}).observe(box);
document.getElementById('replay').onclick=()=>{ stop(); start(); };
if(document.fonts) document.fonts.ready.then(()=>draw(reduce?STILL:t));
})();
</script>
</body>
</html>
