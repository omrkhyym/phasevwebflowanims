  .navbar_component {
    will-change: transform; /* smoother hide/show */

      background-color 0.3s ease,
      color 0.3s ease;
  }

  /* your scrolled color state */
  .navbar_component.is-scrolled {
    background-color: #141238; /* whatever your scrolled look is */
    /* color, box-shadow, backdrop-filter, etc. */
  }
  /* ---- Structural: text-swap mask button ---- */
  .button {
    --btn-lh: 1.4; /* leading buffer: hides ink bleed at the clip seam */
    --btn-nudge: -0.05em; /* optional optical centering, usually leave at 0 */
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    /* keep your own padding / background / border-radius / color / font-size */
  }
  .button .btn-inner {
    position: relative;
    overflow: hidden; /* the real clip */
    display: block;
    transform: translateY(var(--btn-nudge));
  }
  .button .btn-row {
    display: block;
    line-height: var(--btn-lh);
    white-space: nowrap;
  }
  .button .btn-row.is-bottom {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
  }
  .button .word {
    display: inline-block;
    white-space: nowrap; /* keeps spaces intact */
  }
  .button .char {
    display: inline-block;
    line-height: var(--btn-lh);
    will-change: transform;
    backface-visibility: hidden;
  }
  @media (prefers-reduced-motion: reduce) {
    .button .char {
      transform: none !important;
    }

  :root {

  /* your sticky element — add the data hook in Designer */
