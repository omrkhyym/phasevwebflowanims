      <figure class="af-quote is-active" role="tabpanel" id="af-quote-0" aria-labelledby="af-quote-tab-0">
        <blockquote class="af-quote_text">“This was an amazing collaboration between Enlivex and PhaseV leading to the identification of a higher-responder group to our drug Allocetra in Knee osteoarthritis patients. Amazing team, smart, innovative, dedicated, responsive and pleasant.”</blockquote>

      <figure class="af-quote" role="tabpanel" id="af-quote-1" aria-labelledby="af-quote-tab-1" hidden>
        <blockquote class="af-quote_text">“We worked with PhaseV on one of our recent trials to identify clinically meaningful subgroups using Response Optimizer. Their expertise helped us identify a promising subpopulation that otherwise would not have been detected. They collaborated with our internal teams to ensure the findings drove real value for our development plan.”</blockquote>
        <figcaption class="af-quote_who"><span class="af-quote_name">Stu Bailey, D.Phil.</span><span class="af-quote_meta">SVP Head of Clinical Measurement Sciences, EMD Serono</span></figcaption>
      </figure>
      <figure class="af-quote" role="tabpanel" id="af-quote-2" aria-labelledby="af-quote-tab-2" hidden>
        <blockquote class="af-quote_text">“Leveraging PhaseV’s ClinOps Optimizer was a game-changer for us. We identified top-performing sites with proven recruitment success while also achieving geographic and demographic diversity across our trial footprint.”</blockquote>
        <figcaption class="af-quote_who"><span class="af-quote_name">VP, Clinical Operations</span><span class="af-quote_meta">Big Pharma Company</span></figcaption>
      </figure>
      <figure class="af-quote" role="tabpanel" id="af-quote-3" aria-labelledby="af-quote-tab-3" hidden>
        <blockquote class="af-quote_text">“PhaseV’s Portfolio Optimizer helped us uncover and validate new indications to pursue for, guiding our lifecycle management strategy with data-driven confidence.”</blockquote>
        <figcaption class="af-quote_who"><span class="af-quote_name">SVP, Strategy &amp; Portfolio Management</span><span class="af-quote_meta">Big Pharma Company</span></figcaption>
      </figure>
      <figure class="af-quote" role="tabpanel" id="af-quote-4" aria-labelledby="af-quote-tab-4" hidden>
        <blockquote class="af-quote_text">“PhaseV’s Portfolio Optimizer allowed us to draw clear, data-driven connections between biomarkers and clinical outcomes. This deeper understanding of therapeutic relevance has been critical in shaping our development strategy and informing key decisions for future studies, including those with combination arms.”</blockquote>
        <figcaption class="af-quote_who"><span class="af-quote_name">VP of Biometrics</span><span class="af-quote_meta">Big Pharma Company</span></figcaption>
      </figure>
      <figure class="af-quote" role="tabpanel" id="af-quote-5" aria-labelledby="af-quote-tab-5" hidden>
        <blockquote class="af-quote_text">“Through our initial collaboration with PhaseV, we gained an even greater understanding of the effect of PrimeC across multiple patient subgroups. We will apply these insights to optimize the design of our Phase 3 study... We plan to continue to collaborate with PhaseV as we develop our Phase 3 trial.”</blockquote>
        <figcaption class="af-quote_who"><span class="af-quote_name">NeuroSense</span><span class="af-quote_meta"></span></figcaption>
      </figure>
      <figure class="af-quote" role="tabpanel" id="af-quote-6" aria-labelledby="af-quote-tab-6" hidden>
        <blockquote class="af-quote_text">“PhaseV played a vital role in the analysis of our Phase 3 trial in the US, ORA-D-013-1, for the treatment of type 2 diabetes. The analysis found subpopulations of patients that responded very well to oral insulin.”</blockquote>
        <figcaption class="af-quote_who"><span class="af-quote_name">Dr. Miriam Kidron</span><span class="af-quote_meta">CSO, Oramed</span></figcaption>
      </figure>
      <figure class="af-quote" role="tabpanel" id="af-quote-7" aria-labelledby="af-quote-tab-7" hidden>
        <blockquote class="af-quote_text">“Combining our GI expertise with PhaseV’s advanced machine learning capabilities for trial simulation, design, and execution… accelerate success for our sponsors and help address the growing burden of GI diseases more effectively.”</blockquote>
        <figcaption class="af-quote_who"><span class="af-quote_name">Pierre Gaudreault</span><span class="af-quote_meta">CEO, Alimentiv</span></figcaption>
      </figure>
      <figure class="af-quote" role="tabpanel" id="af-quote-8" aria-labelledby="af-quote-tab-8" hidden>
        <blockquote class="af-quote_text">“The addition of prospectively collected clinical-grade real world data to phase 2 results… in conjunction with PhaseV’s proven technology is a critical step forward in improving phase 3 oncology trials, helping to bring new therapies to market.”</blockquote>
        <figcaption class="af-quote_who"><span class="af-quote_name">Michael Pröschel</span><span class="af-quote_meta">CEO, iOMEDICO</span></figcaption>
